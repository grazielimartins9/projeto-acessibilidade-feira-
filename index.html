
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Texto Acessível</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>🔊 Texto Acessível</h1>

            <p>
                Escreva seu texto e transforme suas
                palavras em uma leitura falada.
            </p>
        </header>

        <section>

            <label for="texto">
                Digite ou cole seu texto:
            </label>

            <textarea
                id="texto"
                placeholder="Digite aqui o texto que deseja ouvir..."
            ></textarea>

            <div class="botoes">

                <button onclick="ouvirTexto()">
                    🔊 Ouvir texto
                </button>

                <button class="pausar" onclick="pausarTexto()">
                    ⏸ Pausar
                </button>

                <button class="continuar" onclick="continuarTexto()">
                    ▶ Continuar
                </button>

                <button class="parar" onclick="pararTexto()">
                    ⏹ Parar
                </button>

            </div>

        </section>

        <section class="configuracao">

            <label for="voz">Escolha a voz:</label>

            <select id="voz">
                <option value="">Carregando vozes...</option>
            </select>

            <br><br>

            <label for="velocidade">
                Velocidade da leitura:
            </label>

            <input
                type="range"
                id="velocidade"
                min="0.5"
                max="2"
                value="1"
                step="0.1"
            >

            <p id="valorVelocidade">
                Velocidade: 1x
            </p>

        </section>

        <footer>
            Tecnologia e acessibilidade para todos ❤️
        </footer>

    </main>

    <script src="java.js"></script>

</body>
</html>
